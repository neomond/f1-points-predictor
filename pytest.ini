[pytest]
testpaths = tests
pythonpath = src
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore:Pandas requires version:UserWarning


; This file does three things:
; Sets the project root to the repo, so pytest stops climbing into your home folder.
; Puts src/ on the import path.
; Hides the two harmless warnings from your output (pytz, numexpr).